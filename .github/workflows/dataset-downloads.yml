name: Refresh dataset downloads
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dataset-downloads.yml'
      - '.github/update_dataset_downloads.py'

permissions:
  contents: write

concurrency:
  group: dataset-downloads
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/update_dataset_downloads.py
      - name: Publish changed count
        run: |
          git add assets/dataset-downloads.svg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh cumulative dataset downloads"
            git push origin HEAD:main
          fi
